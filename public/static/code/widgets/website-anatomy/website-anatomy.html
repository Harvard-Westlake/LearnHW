<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Anatomy · One File, One Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#DA0016; --gold:#EDA300; --blue:#539ADC; --blue-20:rgb(83 154 220 / .2); --green:#9CCA00; --orange:#FA7300;
  --ink:#111827; --muted:#6b7280; --border:#e5e7eb; --bg:#f8f9fa;
  --sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --tagc:#1d4ed8; --attrc:#b45309; --strc:#15803d;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden}
button{font-family:inherit}
code{font-family:var(--mono)}

/* ---- shell ---- */
.page-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:.5rem 1rem .4rem;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
.page-head h1{margin:0;font-size:1.12rem;font-weight:700}
.page-head p{margin:.05rem 0 0;color:var(--muted);font-size:.86rem}
.page-head .part{font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.head-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}
.dl,.toolbar a.btn{font:600 .78rem var(--sans);color:var(--ink);border:1px solid #d1d5db;border-radius:.4rem;padding:.18rem .55rem;text-decoration:none;background:#fff;white-space:nowrap;display:inline-flex;align-items:center;gap:.25rem}
.dl:hover,.toolbar a.btn:hover{background:#f3f4f6}
.tabs{display:flex;gap:.1rem;padding:0 1rem;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{appearance:none;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:.45rem .8rem .5rem;font-size:.9rem;font-weight:600;color:#4b5563;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:.45rem;transition:color .15s,border-color .15s}
.tab .num{display:inline-grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;background:#e5e7eb;font-size:.75rem;font-weight:700;color:#374151}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
.tab.active .num{background:var(--red);color:#fff}
.lesson{flex:1;min-height:0;padding:.7rem 1rem .8rem}
.tabpanel{display:none;height:100%;min-height:0}
.tabpanel.active{display:grid;grid-template-columns:minmax(230px,280px) minmax(0,1fr);gap:.8rem}
@media (max-width:860px){ body{overflow:auto} .lesson{height:auto} .tabpanel.active{grid-template-columns:1fr;grid-auto-rows:auto 520px} }

.explain{display:flex;flex-direction:column;gap:.55rem;min-height:0}
.explain h2{margin:0;font-size:1.22rem;line-height:1.2}
.eli5{background:#fff;border:1px solid var(--border);border-left:4px solid var(--gold);border-radius:.6rem;padding:.65rem .85rem .75rem;flex:1;min-height:0;overflow:auto}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eli5 p{margin:.35rem 0 0;font-size:1.08rem;line-height:1.42}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.hint .i{display:inline-grid;place-items:center;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--blue);color:#fff;font:italic 700 .72rem Georgia,serif;vertical-align:-2px}
.controls{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.controls .btn{padding:.3rem .55rem}
.dots{display:flex;gap:.32rem;margin:0 .2rem}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:#d1d5db;border:0;padding:0;cursor:pointer;transition:background .2s,transform .2s}
.dot.done{background:#9ca3af}
.dot.on{background:var(--red);transform:scale(1.25)}
.btn{appearance:none;border:1px solid #d1d5db;background:#fff;color:var(--ink);border-radius:.45rem;padding:.3rem .7rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .1s;min-height:30px}
.btn:hover{background:#f3f4f6}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#b80012}
.btn.playing{background:var(--gold);border-color:var(--gold);color:#111}

.stage{position:relative;background:#fff;border:1px solid var(--border);border-radius:.6rem;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.stage-body{flex:1;min-height:0;position:relative;padding:.7rem}
.toolbar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.4rem .7rem;border-top:1px solid var(--border);background:#fafafa;min-height:2.7rem;font-size:.82rem;color:var(--muted)}
.toolbar .act{display:none;align-items:center;gap:.4rem}
.toolbar .act.show{display:inline-flex}
.info-btn{position:absolute;top:.55rem;right:.55rem;z-index:20;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;border:0;cursor:pointer;font:italic 700 1.05rem Georgia,serif;box-shadow:0 2px 6px rgb(0 0 0/.15);transition:transform .15s,background .15s}
.info-btn:hover{transform:scale(1.06)}
.info-btn.open{background:#1d4ed8}
.info-pop{position:absolute;top:2.95rem;right:.55rem;z-index:21;width:min(400px,calc(100% - 1.2rem));background:#fff;border:1px solid var(--blue);border-radius:.6rem;box-shadow:0 10px 30px rgb(0 0 0/.14);padding:.7rem .9rem .75rem;display:none;max-height:calc(100% - 3.6rem);overflow:auto}
.info-pop.open{display:block}
.info-pop h4{margin:0 0 .35rem;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.info-pop ul{margin:0;padding-left:1.05rem;font-size:.88rem;line-height:1.4}
.info-pop li{margin:.22rem 0}
.info-pop code{font-size:.82em;background:#f3f4f6;padding:0 .25rem;border-radius:.2rem}

/* ---- mock windows ---- */
.win{border:1px solid #d1d5db;border-radius:.6rem;background:#fff;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgb(0 0 0/.06);min-height:0;position:relative;transition:opacity .4s,filter .4s}
.win.dim{opacity:.35;filter:grayscale(1)}
.bar{display:flex;align-items:center;gap:.45rem;padding:.35rem .55rem;background:#f3f4f6;border-bottom:1px solid #e5e7eb;font-size:.78rem;color:var(--muted);flex-shrink:0}
.lights{display:flex;gap:.25rem;flex-shrink:0}
.lights i{width:.55rem;height:.55rem;border-radius:50%;background:#fca5a5;display:block}
.lights i:nth-child(2){background:#fcd34d}.lights i:nth-child(3){background:#86efac}
.url{flex:1;min-width:0;background:#fff;border:1px solid #e5e7eb;border-radius:.4rem;padding:.12rem .5rem;font-family:var(--mono);font-size:.76rem;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtitle{font-weight:600;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbody{flex:1;min-height:0;overflow:auto;position:relative}
.code{font-family:var(--mono);font-size:.78rem;line-height:1.5;padding:.45rem .6rem;white-space:pre;color:#111;position:relative;tab-size:2}
.code .ln{display:block;padding:0 .35rem;border-radius:.25rem;transition:background .3s}
.code .ln.hl{background:#fef3c7}
.code .ln.cur{background:#dbeafe}
.code .ln.flash{background:#fde68a}
.t{color:var(--tagc)}.a{color:var(--attrc)}.s{color:var(--strc)}.c{color:#9ca3af}
.code.squash{white-space:pre-wrap;word-break:break-all}
.page{padding:.7rem .9rem;font-family:Georgia,"Times New Roman",serif;color:#000;background:#fff;min-height:100%;transition:background .4s,color .4s}
.page h1{font-size:1.45rem;margin:0 0 .45rem;font-weight:700}
.page p{margin:0 0 .5rem}
.page a{color:#0000ee;text-decoration:underline}
.page .pimg{display:block;width:76px;height:76px;margin:.2rem 0 .5rem}
.page .jsbtn{display:none}
.ael{display:inline-block;position:relative;border-radius:.2rem;transition:background .25s,box-shadow .25s}
.ael.block{display:block}
.ael.hl{background:rgb(83 154 220/.28);box-shadow:0 0 0 2px var(--blue)}
.page.styled{font-family:var(--sans);background:#fffaf0;color:#1f2937}
.page.styled h1{color:var(--red);letter-spacing:-.01em}
.page.styled a{color:var(--red);text-decoration:none;font-weight:600;border-bottom:2px solid var(--gold)}
.page.about h1{margin-bottom:.4rem}

/* ---- tab a1 ---- */
[data-tab=a1] .stage-body{display:grid;grid-template-columns:1fr 1.1fr;gap:.8rem}
[data-tab=a1] .friend{position:absolute;right:.7rem;bottom:.7rem;width:46%;height:54%;transform:translateY(130%);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s;z-index:4;box-shadow:0 12px 30px rgb(0 0 0/.18)}
[data-tab=a1] .friend.in{transform:none;opacity:1}
.flyer{position:absolute;z-index:6;display:flex;align-items:center;gap:.3rem;background:#fff;border:1px solid var(--border);border-radius:.4rem;padding:.2rem .5rem;font:.78rem var(--mono);box-shadow:0 4px 12px rgb(0 0 0/.15);opacity:0;transition:transform .95s cubic-bezier(.2,.8,.2,1),opacity .3s;pointer-events:none;left:0;top:0}
.flyer.go{opacity:1}
.reveal .ael{opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s,background .25s,box-shadow .25s}
.reveal .ael.in{opacity:1;transform:none}
.errpage{padding:1rem 1rem;color:#374151;font-size:.82rem;font-family:var(--sans)}
.errpage .face{font-size:1.6rem;display:block}
.errpage b{display:block;font-size:.98rem;margin:.3rem 0 .2rem}
.errpage code{display:block;margin-top:.45rem;font-size:.7rem;color:#6b7280}
.errpage .who{display:inline-block;margin-top:.5rem;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--red);background:#fee2e2;padding:.05rem .4rem;border-radius:.25rem}
.rename input{font:inherit;font-size:.85rem;padding:.2rem .5rem;border:1px solid #d1d5db;border-radius:.4rem;width:9rem;margin-left:.3rem}

/* ---- tab a2 ---- */
[data-tab=a2] .stage-body{display:grid;grid-template-columns:minmax(230px,310px) 1fr;gap:.8rem}
[data-tab=a2] .code{font-size:.74rem}
.nests{position:absolute;inset:0;pointer-events:none}
.nest{position:absolute;border:2px solid;border-radius:.4rem;opacity:0;transition:opacity .4s}
.nest.in{opacity:1}
.treewrap{display:flex;flex-direction:column;min-height:0;gap:.4rem}
.treebox{position:relative;flex:1;min-height:0}
.crumb{font:.78rem var(--mono);color:var(--muted);background:#f8fafc;border:1px solid var(--border);border-radius:.4rem;padding:.25rem .55rem;min-height:1.9rem;display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin-right:2.6rem}
.crumb b{color:var(--ink);font-weight:600}
.crumb .sep{color:#cbd5e1}
.crumb .note{margin-left:auto;font-family:var(--sans);font-size:.76rem}
svg.tree{display:block;width:100%;height:100%}
.node{opacity:0;transition:opacity .35s}
.node.shown{opacity:1}
.node .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:7;transition:fill .25s,stroke .25s}
.node .lab{font:600 11.5px var(--mono);fill:var(--tagc);text-anchor:middle;dominant-baseline:middle}
.node .sub{font:9.5px var(--sans);fill:var(--muted);text-anchor:middle;dominant-baseline:middle}
.node.ptr .box{stroke:var(--orange);stroke-dasharray:4 3}
.node.ptr .sub{fill:var(--orange);font-weight:600}
.node.hl .box{fill:#fef3c7;stroke:var(--gold);stroke-width:2.5}
.node.moved .box{fill:#fee2e2;stroke:var(--red);stroke-width:2}
.edge{fill:none;stroke:#cbd5e1;stroke-width:1.6;opacity:0;transition:opacity .35s,stroke .3s}
.edge.shown{opacity:1}
.edge.hl{stroke:var(--gold);stroke-width:2.5}
.edge.moved{stroke:var(--red)}
svg.dim .node:not(.ptr){opacity:.28}
svg.dim .edge{opacity:.3}
.tag-note{position:absolute;left:50%;bottom:.3rem;transform:translateX(-50%);background:#111;color:#fff;font-size:.78rem;padding:.25rem .65rem;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:95%;overflow:hidden;text-overflow:ellipsis}
.tag-note.in{opacity:1}

/* ---- tab a3 ---- */
[data-tab=a3] .browser{height:100%}
[data-tab=a3] .wbody{display:flex;overflow:hidden}
[data-tab=a3] .pagewrap{flex:1;min-width:0;overflow:auto;position:relative}
[data-tab=a3] .devtools{width:0;flex-shrink:0;border-left:1px solid #d1d5db;background:#fff;display:flex;flex-direction:column;overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1);font-family:var(--mono);font-size:.74rem}
[data-tab=a3] .browser.dt .devtools{width:50%}
.dt-tabs{display:flex;border-bottom:1px solid #e5e7eb;background:#f3f4f6;font-family:var(--sans);flex-shrink:0;white-space:nowrap}
.dt-tab{padding:.3rem .6rem;border:0;background:transparent;color:#4b5563;cursor:pointer;border-bottom:2px solid transparent;font-size:.74rem}
.dt-tab.on{color:#111;border-bottom-color:var(--blue);background:#fff}
.dt-tab.off{opacity:.45;cursor:default}
.dt-pane{display:none;flex:1;min-height:0;overflow:auto;padding:.3rem .2rem}
.dt-pane.on{display:block}
.dt-pane .code{font-size:.74rem;padding:.2rem .3rem}
.el{display:block;white-space:nowrap;padding:.08rem .35rem;border-radius:.2rem;cursor:default;color:#111;line-height:1.55}
.el .tg{color:#881280}.el .at{color:#994500}.el .av{color:#1a1aa6}
.el.hov{background:#e8f0fe}
.el.sel{background:#cfe8fc;outline:1px solid var(--blue)}
.el .caret{display:inline-block;width:.8rem;color:#6b7280}
.el.editing .tx{background:#fff;outline:1px solid var(--blue);padding:0 .1rem}
.caret-blink::after{content:'';display:inline-block;width:1px;height:.9em;background:#111;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cursor{position:absolute;z-index:30;width:18px;height:24px;pointer-events:none;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0;left:0;top:0}
.cursor.in{opacity:1}
.ctxmenu{position:absolute;z-index:29;background:#fff;border:1px solid #d1d5db;border-radius:.4rem;box-shadow:0 8px 24px rgb(0 0 0/.18);font-size:.76rem;padding:.25rem 0;min-width:9.5rem;display:none;font-family:var(--sans)}
.ctxmenu.in{display:block}
.ctxmenu div{padding:.18rem .8rem}
.ctxmenu div.hi{background:var(--blue);color:#fff}
.ctxmenu hr{border:0;border-top:1px solid #e5e7eb;margin:.2rem 0}
.tip{position:absolute;z-index:28;background:#1f2937;color:#fff;font:.68rem var(--mono);padding:.14rem .4rem;border-radius:.25rem;display:none;pointer-events:none;white-space:nowrap}
.tip.in{display:block}
.tip b{color:#93c5fd;font-weight:600}
.reload{width:1rem;height:1rem;color:#6b7280;flex-shrink:0}
.reload.spin{animation:spin .8s linear 1}
@keyframes spin{to{transform:rotate(360deg)}}
.pagewrap .page{transition:opacity .25s}
.pagewrap.blank .page{opacity:0}
.poof{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:#111;color:#fff;padding:.3rem .75rem;border-radius:999px;font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;z-index:9;font-family:var(--sans)}
.poof.in{opacity:1}

/* ---- tab a4 ---- */
[data-tab=a4] .stage-body{display:grid;grid-template-columns:minmax(240px,44%) 1fr;gap:.8rem}
[data-tab=a4] .left,[data-tab=a4] .right{display:flex;flex-direction:column;min-height:0;gap:.5rem}
[data-tab=a4] .left .eyebrow{padding:.1rem .2rem}
.net{border:1px solid #d1d5db;border-radius:.5rem;overflow:hidden;font:.72rem var(--mono);background:#fff;flex-shrink:0}
.net-head,.net-row{display:grid;grid-template-columns:5.2rem 2.6rem 4.6rem 1fr;gap:.4rem;align-items:center;padding:.2rem .5rem}
.net-head{background:#f3f4f6;color:#4b5563;border-bottom:1px solid #e5e7eb;font-family:var(--sans);font-weight:600;font-size:.7rem}
.net-row{border-bottom:1px solid #f1f5f9;opacity:.4;transition:opacity .3s}
.net-row.on{opacity:1}
.net-row .st{color:#6b7280}
.net-row.ok .st{color:#15803d;font-weight:700}
.net-row.err .st{color:var(--red);font-weight:700}
.net-row.err .name{color:var(--red);text-decoration:line-through}
.wf{position:relative;height:.7rem;background:#f8fafc;border-radius:.2rem}
.bar2{position:absolute;top:0;bottom:0;left:0;width:0;background:var(--blue);border-radius:.2rem}
.net-row[data-res=index] .bar2{background:#6366f1}
.net-row[data-res=css] .bar2{background:#8b5cf6}
.net-row[data-res=png] .bar2{background:#10b981}
.net-row[data-res=js] .bar2{background:#f59e0b}
.net-row.err .bar2{background:var(--red)}
.timeline{display:flex;justify-content:space-between;font:.64rem var(--mono);color:#9ca3af;padding:.1rem .5rem .2rem 13.6rem}
.preview .pimg{opacity:0;transition:opacity .4s}
.preview.img-loaded .pimg{opacity:1}
.preview.js-loaded .jsbtn{display:inline-block;margin:.2rem 0 .6rem;padding:.3rem .7rem;border-radius:.4rem;border:1px solid #d1d5db;background:#fff;font:inherit;cursor:pointer}
.preview.js-loaded.styled .jsbtn{background:var(--gold);border-color:var(--gold);font-weight:600}
.mismatch{display:none;font-size:.76rem;line-height:1.5;color:var(--red);background:#fef2f2;border:1px solid #fecaca;border-radius:.4rem;padding:.25rem .55rem;flex-shrink:0}
.mismatch.in{display:block}
.mismatch code{background:#fff;padding:0 .25rem;border-radius:.2rem}
.rpanel{position:relative;min-height:0;flex:1;height:100%}
.rpanel>*{position:absolute;inset:0;opacity:0;transition:opacity .35s;pointer-events:none;overflow:auto}
.rpanel>.on{opacity:1;pointer-events:auto}

/* ---- tab a5 ---- */
[data-tab=a5] .stage-body{display:flex;flex-direction:column;gap:.5rem}
.urlbar{display:flex;align-items:center;gap:.5rem;background:#f3f4f6;border:1px solid #d1d5db;border-radius:.5rem;padding:.3rem .55rem;flex-shrink:0;margin-right:2.6rem}
.urlbar .host{font:.84rem var(--mono);color:#374151;white-space:nowrap}
.urlbar input{flex:1;min-width:4rem;font:.84rem var(--mono);padding:.22rem .5rem;border:1px solid #d1d5db;border-radius:.4rem;background:#fff}
.status{font:700 .76rem var(--mono);padding:.1rem .5rem;border-radius:999px;background:#e5e7eb;color:#374151;min-width:3.4rem;text-align:center}
.status.ok{background:#dcfce7;color:#15803d}.status.err{background:#fee2e2;color:var(--red)}
.walkstrip{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;font:.76rem var(--mono);min-height:1.7rem;color:#9ca3af;flex-shrink:0}
.chip{padding:.1rem .5rem;border-radius:999px;background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;transition:background .25s,border-color .25s,color .25s}
.chip.on{background:#fef3c7;border-color:var(--gold);color:#111}
.chip.ok{background:#dcfce7;border-color:#86efac;color:#15803d}
.chip.bad{background:#fee2e2;border-color:#fca5a5;color:var(--red)}
.chip.def.on{background:#dbeafe;border-color:#93c5fd;color:#1d4ed8}
.two{flex:1;min-height:0;display:grid;grid-template-columns:minmax(200px,250px) 1fr;gap:.8rem;position:relative}
.fwrap{min-height:0;overflow:auto;padding:.3rem .1rem}
.ftree,.ftree ul{list-style:none;margin:0;padding:0}
.ftree ul{padding-left:1rem;border-left:1px dashed #e2e8f0;margin-left:.6rem}
.ftree li{margin:.12rem 0}
.ftree .row{display:inline-flex;align-items:center;gap:.35rem;padding:.1rem .45rem;border-radius:.35rem;font:.82rem var(--mono);color:#1f2937;transition:background .25s,box-shadow .25s}
.ftree .row.walk{background:#fef3c7;box-shadow:0 0 0 2px var(--gold)}
.ftree .row.found{background:#dcfce7;box-shadow:0 0 0 2px #86efac}
.ftree .row.fail{background:#fee2e2;box-shadow:0 0 0 2px #fca5a5}
.ftree.build li{opacity:0;transform:translateX(-6px);transition:opacity .3s,transform .3s}
.ftree.build li.in{opacity:1;transform:none}
.ico{width:.85rem;height:.85rem;border-radius:.2rem;display:inline-block;flex-shrink:0}
.ico.fold{background:var(--gold);clip-path:polygon(0 15%,40% 15%,52% 32%,100% 32%,100% 100%,0 100%)}
.ico.html{background:#f97316}.ico.css{background:#3b82f6}.ico.img{background:#10b981}.ico.js{background:#eab308}
.badge{font:700 .6rem var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:0 .35rem;border-radius:.25rem;margin-left:.15rem}

/* ---------- syntax highlight ---------- */
function hl(line){
  let s=esc(line);
  s=s.replace(/(&lt;!doctype html&gt;)/i,'<span class="c">$1</span>');
  return s.replace(/(&lt;\/?)([a-zA-Z][a-zA-Z0-9-]*)([\s\S]*?)(\/?&gt;)/g,(m,lt,tag,rest,gt)=>{
    const attrs=rest.replace(/([a-zA-Z-]+)=(&quot;.*?&quot;)/g,'<span class="a">$1</span>=<span class="s">$2</span>');
    return `<span class="t">${lt}${tag}</span>${attrs}<span class="t">${gt}</span>`;
  });
}

/* ---------- sequencer ---------- */
function makeSeq(){
  let token=0, timers=[];
  const cancel=()=>{ token++; timers.forEach(clearTimeout); timers=[]; };
  return {
    cancel,
    run(list){ cancel(); const my=token; let t=0; list.forEach(([d,fn])=>{ t+=d; timers.push(setTimeout(()=>{ if(my===token) fn(); },t)); }); },
    loop(ms,fn){ cancel(); const my=token; const tick=()=>{ if(my!==token) return; fn(); timers.push(setTimeout(tick,ms)); }; timers.push(setTimeout(tick,0)); }
  };
}
function tween(ms,onFrame,onDone){ const t0=performance.now(); const f=now=>{ const k=Math.min(1,(now-t0)/ms); const e=k<.5?2*k*k:-1+(4-2*k)*k; onFrame(e); if(k<1) requestAnimationFrame(f); else onDone&&onDone(); }; requestAnimationFrame(f); }

/* ---------- SVG tree view ---------- */
class TreeView{
  constructor(svg,opts={}){
    this.svg=svg; this.opts=Object.assign({dir:'down',nodeW:84,nodeH:34,pad:10,subMode:'text',onHover:null},opts);
    this.nodes=new Map(); this.tree=null;
    svg.innerHTML='<g class="edges"></g><g class="nodes"></g>';
    this.gEdges=svg.querySelector('.edges'); this.gNodes=svg.querySelector('.nodes');
    new ResizeObserver(()=>this.relayout(false)).observe(svg);
  }
  setTree(tree,animate){
    this.tree=tree; const seen=new Set();
    const walk=(n,parent)=>{ seen.add(n.id); let rec=this.nodes.get(n.id); if(!rec){ rec=this.makeNode(n); this.nodes.set(n.id,rec); } rec.data=n; rec.parent=parent; this.setLabels(rec); (n.kids||[]).forEach(k=>walk(k,n)); };
    walk(tree,null);
    for(const [id,rec] of this.nodes){ if(!seen.has(id)){ rec.g.remove(); rec.edge.remove(); this.nodes.delete(id); } }
    this.relayout(animate);
  }
  makeNode(n){
    const g=document.createElementNS(NS,'g'); g.classList.add('node'); g.dataset.id=n.id;
    const rect=document.createElementNS(NS,'rect'); rect.classList.add('box');
    const lab=document.createElementNS(NS,'text'); lab.classList.add('lab');
    const sub=document.createElementNS(NS,'text'); sub.classList.add('sub');
    g.append(rect,lab,sub); this.gNodes.appendChild(g);
    const edge=document.createElementNS(NS,'path'); edge.classList.add('edge'); edge.dataset.id=n.id; this.gEdges.appendChild(edge);
    g.addEventListener('mouseenter',()=>this.opts.onHover&&this.opts.onHover(n.id));
    g.addEventListener('mouseleave',()=>this.opts.onHover&&this.opts.onHover(null));
    return {g,edge,rect,lab,sub,pos:null};
  }
  setLabels(rec){
    const n=rec.data; rec.g.classList.toggle('ptr',!!n.ptr);
    rec.lab.textContent=`<${n.tag}>`;
    rec.subFull=this.opts.subMode==='ptr'?(n.ptr||n.text||''):(n.text||'');
    rec.sub.textContent=rec.subFull;
  }
  computeLayout(){
    const r=this.svg.getBoundingClientRect(); const w=r.width||600, h=r.height||400; const {dir,pad}=this.opts;
    const pos=new Map(); let leafI=0, maxD=0;
    const walk=(n,d)=>{ maxD=Math.max(maxD,d); let lx; if(!n.kids||!n.kids.length){ lx=leafI++; } else { const xs=n.kids.map(k=>walk(k,d+1)); lx=(xs[0]+xs[xs.length-1])/2; } pos.set(n.id,{d,lx}); return lx; };
    walk(this.tree,0);
    const leaves=Math.max(1,leafI), depth=maxD+1, out=new Map();
    if(dir==='down'){ const slot=(w-2*pad)/leaves, row=(h-2*pad)/depth; const nw=Math.max(40,Math.min(this.opts.nodeW,slot-6)); const nh=Math.min(this.opts.nodeH,row-14);
      for(const [id,p] of pos) out.set(id,{x:pad+(p.lx+.5)*slot,y:pad+(p.d+.5)*row,nw,nh}); }
    else { const slot=(h-2*pad)/leaves, col=(w-2*pad)/depth; const nw=Math.max(40,Math.min(this.opts.nodeW,col-16)); const nh=Math.max(22,Math.min(this.opts.nodeH,slot-4));
      for(const [id,p] of pos) out.set(id,{x:pad+(p.d+.5)*col,y:pad+(p.lx+.5)*slot,nw,nh}); }
    return out;
  }
  relayout(animate){
    if(!this.tree) return; const target=this.computeLayout(); const from=new Map();
    for(const [id,rec] of this.nodes) from.set(id,rec.pos||target.get(id));
    const apply=k=>{ for(const [id,rec] of this.nodes){ const a=from.get(id),b=target.get(id); if(!b) continue; const p={x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k,nw:b.nw,nh:b.nh}; rec.pos=p; this.place(rec,p); } for(const rec of this.nodes.values()) this.drawEdge(rec); };
    if(animate) tween(480,apply); else apply(1);
  }
  place(rec,p){
    rec.g.setAttribute('transform',`translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    rec.rect.setAttribute('x',-p.nw/2); rec.rect.setAttribute('y',-p.nh/2); rec.rect.setAttribute('width',p.nw); rec.rect.setAttribute('height',p.nh);
    const maxCh=Math.max(4,Math.floor((p.nw-6)/5.3)); const full=rec.subFull||'';
    rec.sub.textContent=full.length>maxCh?full.slice(0,maxCh-1)+'…':full;
    const hasSub=!!full && p.nh>=28;
    rec.sub.style.display=hasSub?'':'none';
    rec.lab.setAttribute('y',hasSub?-5:1); rec.sub.setAttribute('y',8);
  }
  drawEdge(rec){
    if(!rec.parent){ rec.edge.setAttribute('d',''); return; }
    const P=this.nodes.get(rec.parent.id).pos, C=rec.pos; if(!P||!C) return;
    let d;
    if(this.opts.dir==='down'){ const y1=P.y+P.nh/2, y2=C.y-C.nh/2, my=(y1+y2)/2; d=`M${P.x} ${y1} C${P.x} ${my} ${C.x} ${my} ${C.x} ${y2}`; }
    else { const x1=P.x+P.nw/2, x2=C.x-C.nw/2, mx=(x1+x2)/2; d=`M${x1} ${P.y} C${mx} ${P.y} ${mx} ${C.y} ${x2} ${C.y}`; }
    rec.edge.setAttribute('d',d);
  }
  cls(id,c,on){ const r=this.nodes.get(id); if(r){ r.g.classList.toggle(c,on); r.edge.classList.toggle(c,on); } }
  clsAll(c,on){ for(const id of this.nodes.keys()) this.cls(id,c,on); }
  ancestors(id){ const out=[]; let r=this.nodes.get(id); while(r){ out.unshift(r.data.id); r=r.parent?this.nodes.get(r.parent.id):null; } return out; }
}

const FILES=new Set(['index.html','about/index.html','css/style.css','img/mochi.png','js/app.js']);
const DIRS=new Set(['','about/','css/','img/','js/']);
function resolvePath(input){
  const p=(input||'').trim().replace(/^\/+/,''); const steps=[]; let cur='';
  if(p==='') return {steps,file:'index.html',defaulted:true};
  const segs=p.split('/');
  for(let i=0;i<segs.length;i++){
    const s=segs[i], last=i===segs.length-1;
    if(s===''){ const f=cur+'index.html'; return FILES.has(f)?{steps,file:f,defaulted:true}:{steps,file:null}; }
    const asDir=cur+s+'/', asFile=cur+s;
    if(DIRS.has(asDir)&&(!last||!FILES.has(asFile))){ steps.push({seg:s,path:asDir,ok:true,parent:cur}); cur=asDir; if(last){ const f=asDir+'index.html'; return FILES.has(f)?{steps,file:f,defaulted:true,clean:true}:{steps,file:null}; } continue; }
    if(last&&FILES.has(asFile)){ steps.push({seg:s,path:asFile,ok:true,parent:cur}); return {steps,file:asFile,defaulted:false}; }
    steps.push({seg:s,path:asFile,ok:false,parent:cur}); return {steps,file:null};
  }
  return {steps,file:null};
}

function a5Connectors(ctx,map){

function a5Walk(ctx,path,opts={}){

      const li=document.createElement('li'); li.className='ghost'; li.innerHTML=`<span class="row"><span class="ico" style="background:#fca5a5"></span>${esc(s.seg)} ?</span>`; ul.appendChild(li); } }]));

  else list.push([360,()=>{ status.className='status err'; status.textContent='404'; a5View(ctx,'404'); }]);

  $$('.dot',panel).forEach((d,k)=>{ d.classList.toggle('on',k===si); d.classList.toggle('done',k<si); });
  panel.querySelector('.prev').disabled=si===0;
  const next=panel.querySelector('.next'); next.textContent=si===t.steps.length-1?(ti<TABS.length-1?'Next part ›':'Done'):'Next ›'; next.disabled=si===t.steps.length-1&&ti===TABS.length-1;
  $$('.toolbar .act',panel).forEach(a=>a.classList.toggle('show',a.dataset.steps.split(',').includes(String(si))));
  st.enter(t.ctx);
  try{ history.replaceState(null,'',`#${t.id}-${si+1}`); }catch(e){}
  if(state.autoplay) scheduleNext();
}
function scheduleNext(){ clearTimeout(state.timer); const t=TABS[state.tab], si=state.steps[state.tab]; const dur=t.steps[si].dur||6500;
  state.timer=setTimeout(()=>{ if(!state.autoplay) return; if(si<t.steps.length-1) enterStep(state.tab,si+1); else stopPlay(); },dur); }
function startPlay(){ state.autoplay=true; const p=TABS[state.tab].ctx.panel.querySelector('.play'); p.textContent='❚❚ Pause'; p.classList.add('playing'); replay(); }
function stopPlay(){ state.autoplay=false; clearTimeout(state.timer); $$('.play').forEach(p=>{ p.textContent='▶ Play'; p.classList.remove('playing'); }); }

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight'){ stopPlay(); const i=state.tab; if(state.steps[i]<TABS[i].steps.length-1) enterStep(i,state.steps[i]+1); else if(i<TABS.length-1) selectTab(i+1); }
  if(e.key==='ArrowLeft'){ stopPlay(); const i=state.tab; if(state.steps[i]>0) enterStep(i,state.steps[i]-1); else if(i>0){ state.steps[i-1]=TABS[i-1].steps.length-1; selectTab(i-1); } }
  if(e.key===' '&&!e.target.matches('button')){ e.preventDefault(); state.autoplay?stopPlay():startPlay(); }
});

(function boot(){
  const m=/^#([a-z]\d)-(\d+)$/.exec(location.hash||''); let ti=0, si=0;
  if(m){ const k=TABS.findIndex(t=>t.id===m[1]); if(k>=0){ ti=k; si=Math.min(TABS[k].steps.length-1,Math.max(0,parseInt(m[2],10)-1)); } }
  state.steps[ti]=si; selectTab(ti);
})();
})();
</script>
